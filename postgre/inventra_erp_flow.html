<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventra ERP — Guia do Ciclo Completo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0f14;
    --bg2: #13161e;
    --bg3: #1a1e29;
    --border: rgba(255,255,255,0.07);
    --border-hi: rgba(255,255,255,0.15);
    --text: #e8e6df;
    --text2: #8a8a8a;
    --text3: #555;
    --accent: #5b8aff;
    --accent2: #a78bfa;
    --green: #34d399;
    --amber: #fbbf24;
    --coral: #fb7185;
    --teal: #22d3ee;
    --font-head: 'Syne', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(91,138,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(91,138,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow orb */
  body::after {
    content: '';
    position: fixed;
    top: -200px; left: 50%;
    transform: translateX(-50%);
    width: 800px; height: 600px;
    background: radial-gradient(ellipse, rgba(91,138,255,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ─── HEADER ─── */
  header {
    position: relative; z-index: 10;
    padding: 3rem 2rem 2rem;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(91,138,255,0.04) 0%, transparent 100%);
  }

  .logo-chip {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(91,138,255,0.1);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 16px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 1.5rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .logo-chip span { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: pulse 2s ease-in-out infinite; }

  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.5)} }

  h1 {
    font-family: var(--font-head);
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    line-height: 1.05;
    margin-bottom: 0.75rem;
  }

  h1 em {
    font-style: normal;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 15px;
    color: var(--text2);
    max-width: 480px;
    margin: 0 auto 2rem;
    line-height: 1.6;
    font-weight: 300;
  }

  /* ─── PHASE TABS ─── */
  .phase-nav {
    display: flex; gap: 6px; justify-content: center; flex-wrap: wrap;
    padding: 1.25rem 2rem;
    position: sticky; top: 0; z-index: 20;
    background: rgba(13,15,20,0.92);
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
  }

  .phase-btn {
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 6px 15px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(91,138,255,0.05);
    color: var(--text2);
    cursor: pointer;
    transition: all .2s;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .phase-btn:hover { color: var(--text); border-color: var(--border-hi); background: rgba(91,138,255,0.1); }
  .phase-btn.active { background: var(--accent); border-color: var(--accent); color: var(--bg); font-weight: 600; }
  .phase-btn[data-phase="setup"].active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  .phase-btn[data-phase="cadastro"].active { background: var(--teal); border-color: var(--teal); color: var(--bg); }
  .phase-btn[data-phase="operation"].active { background: var(--amber); border-color: var(--amber); color: var(--bg); }
  .phase-btn[data-phase="automation"].active { background: var(--coral); border-color: var(--coral); color: var(--bg); }
  .phase-btn[data-phase="dashboard"].active { background: var(--green); border-color: var(--green); color: var(--bg); }

  /* ─── LAYOUT ─── */
  .container {
    position: relative; z-index: 5;
    max-width: 1100px;
    margin: 0 auto;
    padding: 2rem;
    display: grid;
    grid-template-columns: 260px 1fr;
    gap: 1.5rem;
    align-items: start;
  }

  /* ─── STEP LIST ─── */
  .step-list {
    display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 60px;
  }

  .step-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: all .15s;
    background: transparent;
  }
  .step-item:hover { background: var(--bg3); border-color: var(--border); }
  .step-item.active {
    background: rgba(91,138,255,0.06);
    border-color: var(--border-hi);
  }

  .step-num {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text3);
    min-width: 20px;
  }

  .step-badge {
    font-size: 9px;
    font-family: var(--font-mono);
    padding: 2px 7px;
    border-radius: 10px;
    font-weight: 500;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .b-setup { background: rgba(167,139,250,0.15); border: 1px solid rgba(167,139,250,0.35); color: var(--accent2); }
  .b-cadastro { background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.35); color: var(--teal); }
  .b-operation { background: rgba(251,191,36,0.12); border: 1px solid rgba(251,191,36,0.35); color: var(--amber); }
  .b-automation { background: rgba(251,113,133,0.12); border: 1px solid rgba(251,113,133,0.35); color: var(--coral); }
  .b-dashboard { background: rgba(52,211,153,0.12); border: 1px solid rgba(52,211,153,0.32); color: var(--green); }

  .step-title {
    font-size: 12px;
    color: var(--text2);
    font-weight: 400;
    transition: color .15s;
    line-height: 1.3;
  }
  .step-item.active .step-title,
  .step-item:hover .step-title { color: var(--text); }

  .step-arrow {
    text-align: center;
    color: var(--text3);
    font-size: 10px;
    padding: 1px 0;
  }

  /* ─── DETAIL PANEL ─── */
  .detail-panel {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 2rem;
    min-height: 480px;
    transition: all .2s, border-color .2s, box-shadow .2s;
  }
  .detail-panel:hover { border-color: var(--border-hi); box-shadow: 0 0 0 1px rgba(91,138,255,0.06); }

  .panel-header {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 1.25rem;
    padding-bottom: 1.25rem;
    border-bottom: 1px solid var(--border);
  }

  .panel-step-num {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text3);
    padding-top: 4px;
    min-width: 24px;
  }

  .panel-title {
    font-family: var(--font-head);
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.01em;
    line-height: 1.2;
  }

  .panel-desc {
    font-size: 14px;
    color: var(--text2);
    line-height: 1.7;
    margin-bottom: 1.5rem;
    font-weight: 300;
  }

  /* Tables */
  .tables-section { margin-bottom: 1.5rem; }

  .tables-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--text3);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .table-block {
    background: rgba(0,0,0,0.25);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .table-header {
    padding: 9px 14px;
    background: rgba(0,0,0,0.4);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }

  .table-name {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent);
    font-weight: 500;
  }

  .field-row {
    display: grid;
    grid-template-columns: 180px 140px 1fr;
    gap: 8px;
    padding: 8px 14px;
    font-size: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    align-items: center;
  }
  .field-row:last-child { border-bottom: none; }
  .field-row:hover { background: rgba(91,138,255,0.03); }

  .field-name { font-family: var(--font-mono); color: var(--text); font-size: 11px; background: rgba(0,0,0,0.3); padding: 1px 6px; border-radius: 4px; display: inline-block; }
  .field-type { font-family: var(--font-mono); font-size: 10px; color: var(--teal); }
  .field-note { font-size: 11px; color: var(--text2); }

  /* Queries section */
  .queries-section { margin-bottom: 1.5rem; }
  .query-item {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text2);
    padding: 8px 14px;
    background: rgba(0,0,0,0.3);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 6px;
    border-left: 3px solid var(--green);
  }

  /* Tip */
  .tip-box {
    background: rgba(91,138,255,0.06);
    border: 1px solid rgba(91,138,255,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text2);
    line-height: 1.6;
    margin-bottom: 1.5rem;
  }

  /* Navigation buttons */
  .nav-buttons {
    display: flex; gap: 8px; margin-top: 1.5rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
  }

  .nav-btn {
    flex: 1;
    padding: 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: rgba(91,138,255,0.05);
    color: var(--text2);
    font-family: var(--font-mono);
    font-size: 12px;
    cursor: pointer;
    transition: all .15s;
  }
  .nav-btn:hover:not(:disabled) { background: rgba(91,138,255,0.12); color: var(--text); border-color: var(--border-hi); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  .nav-btn.next { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .nav-btn.next:hover { opacity: 0.85; }

  /* ─── PROGRESS BAR ─── */
  .progress-bar-wrap {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
    height: 3px;
    background: rgba(255,255,255,0.05);
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .3s ease;
  }

  /* ─── PHASE SECTION HEADER ─── */
  .phase-header {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 0 4px;
    margin-top: 4px;
  }
  .phase-header-line { flex: 1; height: 1px; background: var(--border); }
  .phase-header-label {
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text3);
  }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 700px) {
    .container { grid-template-columns: 1fr; }
    .step-list { position: static; display: none; }
    .step-list.mobile-open { display: flex; }
  }

  /* ─── FADE IN ─── */
  .detail-panel { animation: fadeIn .2s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* Empty state */
  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 300px; color: var(--text3);
    font-size: 14px; gap: 8px;
  }
  .empty-state span { font-size: 32px; }

  /* ─── GALAXY BACKGROUND ─── */
  #bg {
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<header>
  <div class="logo-chip"><span></span> INVENTRA · ERP · POSTGRESQL</div>
  <h1>Ciclo completo do<br><em>sistema de estoque</em></h1>
  <p class="subtitle">Do cadastro de usuários até os dashboards — todas as 18 etapas do fluxo, tabelas e campos do modelo lógico.</p>
</header>

<nav class="phase-nav">
  <button class="phase-btn active" data-phase="all" onclick="filterPhase('all')">Todos</button>
  <button class="phase-btn" data-phase="setup" onclick="filterPhase('setup')">Configuração</button>
  <button class="phase-btn" data-phase="cadastro" onclick="filterPhase('cadastro')">Cadastros</button>
  <button class="phase-btn" data-phase="operation" onclick="filterPhase('operation')">Operação</button>
  <button class="phase-btn" data-phase="automation" onclick="filterPhase('automation')">Automação</button>
  <button class="phase-btn" data-phase="dashboard" onclick="filterPhase('dashboard')">Dashboard</button>
</nav>

<main class="container">
  <aside id="step-list" class="step-list"></aside>
  <section id="detail-panel" class="detail-panel">
    <div class="empty-state"><span>→</span><p>Selecione uma etapa ao lado</p></div>
  </section>
</main>

<div class="progress-bar-wrap"><div class="progress-bar" id="progress-bar"></div></div>

<script>
// ══════════════════════════ GALAXY BACKGROUND ══════════════════════════
const bgCanvas = document.getElementById('bg');
const bgCtx = bgCanvas.getContext('2d');
let BW, BH, stars = [], nodes = [];

function resizeBg() {
  BW = bgCanvas.width = window.innerWidth;
  BH = bgCanvas.height = window.innerHeight;
}

function initField() {
  stars = [];
  const starCount = Math.floor((BW * BH) / 3200);
  for (let i = 0; i < starCount; i++) {
    stars.push({
      x: Math.random() * BW,
      y: Math.random() * BH,
      r: Math.random() * 1.3 + 0.2,
      baseAlpha: Math.random() * 0.6 + 0.15,
      tw: Math.random() * Math.PI * 2,
      tws: Math.random() * 0.02 + 0.006,
    });
  }
  nodes = [];
  const nodeCount = Math.floor((BW * BH) / 26000);
  for (let i = 0; i < nodeCount; i++) {
    nodes.push({
      x: Math.random() * BW,
      y: Math.random() * BH,
      vx: (Math.random() - 0.5) * 0.25,
      vy: (Math.random() - 0.5) * 0.25,
      r: Math.random() * 1.8 + 1,
    });
  }
}

resizeBg();
initField();
window.addEventListener('resize', () => { resizeBg(); initField(); });

function drawBg() {
  bgCtx.clearRect(0, 0, BW, BH);

  // static starfield with subtle twinkle
  stars.forEach(s => {
    s.tw += s.tws;
    const a = s.baseAlpha * (0.6 + 0.4 * Math.sin(s.tw));
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    bgCtx.fillStyle = `rgba(232,244,248,${a})`;
    bgCtx.fill();
  });

  // slow drifting nodes with constellation links
  nodes.forEach(n => {
    n.x += n.vx; n.y += n.vy;
    if (n.x < 0 || n.x > BW) n.vx *= -1;
    if (n.y < 0 || n.y > BH) n.vy *= -1;
  });
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x, dy = nodes[i].y - nodes[j].y;
      const d = Math.sqrt(dx * dx + dy * dy);
      if (d < 140) {
        bgCtx.beginPath();
        bgCtx.moveTo(nodes[i].x, nodes[i].y);
        bgCtx.lineTo(nodes[j].x, nodes[j].y);
        bgCtx.strokeStyle = `rgba(167,139,250,${0.18 * (1 - d / 140)})`;
        bgCtx.lineWidth = 0.6;
        bgCtx.stroke();
      }
    }
  }
  nodes.forEach(n => {
    bgCtx.beginPath();
    bgCtx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    bgCtx.fillStyle = 'rgba(91,138,255,.55)';
    bgCtx.fill();
    bgCtx.beginPath();
    bgCtx.arc(n.x, n.y, n.r * 3, 0, Math.PI * 2);
    bgCtx.fillStyle = 'rgba(91,138,255,.06)';
    bgCtx.fill();
  });

  requestAnimationFrame(drawBg);
}
drawBg();

const PHASES = {
  setup: { label: 'Config', color: 'b-setup' },
  cadastro: { label: 'Cadastro', color: 'b-cadastro' },
  operation: { label: 'Operação', color: 'b-operation' },
  automation: { label: 'Automação', color: 'b-automation' },
  dashboard: { label: 'Dashboard', color: 'b-dashboard' },
};

const steps = [
  {
    id:1, phase:'setup', title:'Criar perfil de acesso',
    desc:'Antes de criar qualquer usuário, defina os perfis de acesso. Cada perfil determina o que o usuário pode ver e fazer no sistema. Modelo RBAC básico — a lógica de permissões fica na aplicação.',
    tables:{
      tb_profile:[
        {name:'id_profile',type:'INTEGER PK',note:'auto-incremento'},
        {name:'access_type',type:'VARCHAR(50)',note:'ex: admin, gestor, operador'},
        {name:'description',type:'VARCHAR(255)',note:'descrição das permissões'},
      ]
    },
    tip:'💡 Crie ao menos: Administrador, Gestor de Cozinha, Operador e Auditor antes de criar usuários.'
  },
  {
    id:2, phase:'setup', title:'Cadastrar cozinha',
    desc:'O sistema é multi-cozinha. Cada unidade operacional é uma "cozinha". Quase tudo no sistema é vinculado a uma cozinha — usuários, produtos, estoques, inventários e requisições.',
    tables:{
      tb_kitchen:[
        {name:'id_kitchen',type:'INTEGER PK',note:'auto-incremento'},
        {name:'name',type:'VARCHAR(120)',note:'nome da unidade'},
        {name:'code',type:'VARCHAR(20)',note:'código interno'},
        {name:'address',type:'VARCHAR(255)',note:'endereço físico'},
        {name:'active',type:'BOOLEAN',note:'ativa ou desativada'},
        {name:'created_at',type:'TIMESTAMP',note:'preenchido automaticamente'},
      ]
    },
    tip:'💡 Um usuário pode ser vinculado a uma cozinha específica (id_kitchen em tb_user).'
  },
  {
    id:3, phase:'setup', title:'Criar usuário',
    desc:'Crie o usuário, vincule ao perfil e à cozinha. O id_user é UUID — garante unicidade global mesmo em ambientes distribuídos. Nunca armazene senha em texto puro — use hash (bcrypt, argon2).',
    tables:{
      tb_user:[
        {name:'id_user',type:'UUID PK',note:'gerado automaticamente (uuid_generate_v4)'},
        {name:'name',type:'VARCHAR(120)',note:''},
        {name:'email',type:'VARCHAR(150)',note:'login do usuário, único'},
        {name:'password_hash',type:'VARCHAR(255)',note:'hash bcrypt, nunca texto puro'},
        {name:'role',type:'VARCHAR(80)',note:'cargo livre, ex: chef de cozinha'},
        {name:'id_kitchen',type:'INTEGER FK',note:'cozinha principal do usuário'},
        {name:'id_profile',type:'INTEGER FK',note:'perfil de acesso'},
        {name:'active',type:'BOOLEAN',note:'suspender sem deletar'},
        {name:'last_login',type:'TIMESTAMP',note:'rastreia último acesso'},
        {name:'created_at',type:'TIMESTAMP',note:''},
      ]
    },
    tip:'💡 O campo active permite suspender acesso sem perder histórico de ações do usuário.'
  },
  {
    id:4, phase:'cadastro', title:'Cadastrar fornecedor',
    desc:'Fornecedores são vinculados a produtos via tb_product_supplier. Um produto pode ter múltiplos fornecedores com preços e lead times diferentes. O campo rating permite ranquear fornecedores.',
    tables:{
      tb_supplier:[
        {name:'id_supplier',type:'INTEGER PK',note:''},
        {name:'legal_name',type:'VARCHAR(150)',note:'razão social'},
        {name:'cnpj',type:'VARCHAR(18)',note:'ex: 00.000.000/0001-00'},
        {name:'email',type:'VARCHAR(150)',note:''},
        {name:'whatsapp',type:'VARCHAR(20)',note:'contato rápido por WhatsApp'},
        {name:'rating',type:'INTEGER',note:'1-5, avaliação do fornecedor'},
        {name:'active',type:'BOOLEAN',note:''},
        {name:'created_at',type:'TIMESTAMP',note:''},
      ]
    },
    tip:'💡 rating permite ranquear e comparar fornecedores nos dashboards de compras.'
  },
  {
    id:5, phase:'cadastro', title:'Cadastrar unidade de medida',
    desc:'Defina as unidades de medida antes de criar produtos. Produtos são vinculados a uma unidade padrão, que determina como os saldos são exibidos e somados.',
    tables:{
      tb_measurement_unit:[
        {name:'id_unit',type:'INTEGER PK',note:''},
        {name:'symbol',type:'VARCHAR(10)',note:'ex: kg, L, cx, un, pct'},
        {name:'description',type:'VARCHAR(60)',note:'ex: Quilograma, Litro, Caixa'},
      ]
    },
    tip:'💡 Crie todas as unidades antes de cadastrar produtos. Inclua versões para peso, volume e contagem.'
  },
  {
    id:6, phase:'cadastro', title:'Cadastrar categoria',

let currentPhase = 'all';
let currentStepId = 1;

function getFiltered() {
  return currentPhase === 'all' ? steps : steps.filter(s => s.phase === currentPhase);
}

function filterPhase(phase) {
  currentPhase = phase;
  document.querySelectorAll('.phase-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.phase === phase);
  });
  const filtered = getFiltered();
  if (!filtered.find(s => s.id === currentStepId)) {
    currentStepId = filtered[0]?.id;
  }
  renderAll();
}

function selectStep(id) {
  currentStepId = id;
  renderAll();
  document.getElementById('detail-panel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderAll() {
  renderList();
  renderDetail();
  renderProgress();
}

function renderList() {
  const list = document.getElementById('step-list');
  const filtered = getFiltered();

  let html = '';
  let lastPhase = null;

  filtered.forEach((s, i) => {
    if (s.phase !== lastPhase) {
      if (lastPhase !== null) html += `<div class="step-arrow">·</div>`;
      html += `<div class="phase-header"><div class="phase-header-line"></div><span class="phase-header-label">${PHASES[s.phase].label}</span><div class="phase-header-line"></div></div>`;
      lastPhase = s.phase;
    }
    html += `
      <div class="step-item ${s.id === currentStepId ? 'active' : ''}" onclick="selectStep(${s.id})">
        <span class="step-num">${String(s.id).padStart(2,'0')}</span>
        <span class="step-badge ${PHASES[s.phase].color}">${PHASES[s.phase].label}</span>
        <span class="step-title">${s.title}</span>
      </div>
    `;
    if (i < filtered.length - 1 && filtered[i+1].phase === s.phase) {
      html += `<div class="step-arrow">↓</div>`;
    }
  });

  list.innerHTML = html;
}

function renderDetail() {
  const s = steps.find(x => x.id === currentStepId);
  const panel = document.getElementById('detail-panel');
  if (!s) { panel.innerHTML = '<div class="empty-state"><span>→</span><p>Selecione uma etapa</p></div>'; return; }

  const tableHtml = Object.entries(s.tables || {}).map(([tname, fields]) => `
    <div class="table-block">
      <div class="table-header">
        <span class="table-name">${tname}</span>
      </div>
      ${fields.map(f => `
        <div class="field-row">
          <span class="field-name">${f.name}</span>
          <span class="field-type">${f.type}</span>
          <span class="field-note">${f.note}</span>
        </div>
      `).join('')}
    </div>
  `).join('');

  const queriesHtml = s.queries ? `
    <div class="queries-section">
      <div class="tables-label">Queries / Métricas</div>
      ${s.queries.map(q => `<div class="query-item">${q}</div>`).join('')}
    </div>
  ` : '';

  const filtered = getFiltered();
  const idx = filtered.findIndex(x => x.id === s.id);
  const prev = filtered[idx - 1];
  const next = filtered[idx + 1];

  panel.innerHTML = `
    <div class="panel-header">
      <span class="panel-step-num">${String(s.id).padStart(2,'0')}</span>
      <div>
        <span class="step-badge ${PHASES[s.phase].color}" style="margin-bottom:6px;display:inline-block;">${PHASES[s.phase].label}</span>
        <div class="panel-title">${s.title}</div>
      </div>
    </div>
    <p class="panel-desc">${s.desc}</p>
    ${Object.keys(s.tables||{}).length ? `<div class="tables-section"><div class="tables-label">Tabelas envolvidas</div>${tableHtml}</div>` : ''}
    ${queriesHtml}
    ${s.tip ? `<div class="tip-box">${s.tip}</div>` : ''}
    <div class="nav-buttons">
      <button class="nav-btn" onclick="selectStep(${prev?.id})" ${!prev ? 'disabled' : ''}>← ${prev ? prev.title : ''}</button>
      <button class="nav-btn next" onclick="selectStep(${next?.id})" ${!next ? 'disabled' : ''}>${next ? next.title : 'Fim'} →</button>
    </div>
  `;
}

function renderProgress() {
  const filtered = getFiltered();
  const idx = filtered.findIndex(x => x.id === currentStepId);
  const pct = filtered.length > 1 ? ((idx + 1) / filtered.length) * 100 : 100;
  document.getElementById('progress-bar').style.width = pct + '%';
}

// Init
renderAll();
</script>
