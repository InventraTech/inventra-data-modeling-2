name: pages

# Publica o database-workspace.html no GitHub Pages.
# O HTML é autossuficiente (dados embutidos); só as imagens da modelagem ficam ao lado.
on:
  push:
    branches: [main]
    paths:
      - database-workspace.html
      - postgre/docs/modeling/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Montar o site
        run: |
          mkdir -p _site/postgre/docs
          cp database-workspace.html _site/index.html
          cp -r postgre/docs/modeling _site/postgre/docs/modeling
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
