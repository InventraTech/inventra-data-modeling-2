name: Redis integration
on:
  pull_request:
    paths: ['redis/**', '.github/workflows/redis-tests.yml']
  push:
    branches: [main]
    paths: ['redis/**', '.github/workflows/redis-tests.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  redis:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: redis
    services:
      redis:
        image: redis:7-alpine
        ports: ['16379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inventra_ranking_test
          POSTGRES_USER: ranking_test
          POSTGRES_PASSWORD: ranking_test
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U ranking_test -d inventra_ranking_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: redis/pom.xml
      - name: Build and test INV2-24 INV2-25 INV2-26
        env:
          REDIS_INTEGRATION_TESTS: 'true'
          REDIS_RANKING_TESTS: 'true'
          POSTGRES_REDIS_RANKING_TESTS: 'true'
          REDIS_HOST: '127.0.0.1'
          REDIS_PORT: '16379'
          REDIS_DATABASE: '0'
          REDIS_SSL: 'false'
          REDIS_USERNAME: ''
          REDIS_PASSWORD: ''
        run: bash mvnw -B -ntp verify
