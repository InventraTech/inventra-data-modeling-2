spring.application.name=ms-inventra-api

server.port=${PORT:8080}
# Atrás do proxy do Render: usa o X-Forwarded-For para o IP real do cliente (limite de tentativas no login)
server.forward-headers-strategy=native

# Swagger UI / OpenAPI: ligado por padrão; desligue em produção com SWAGGER_ENABLED=false
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

# Job diário que marca lotes vencidos como EXPIRED (BatchExpirationJob)
app.jobs.batch-expiration.enabled=${BATCH_EXPIRATION_JOB_ENABLED:true}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
# Log de SQL desligado por padrão (produção); ligue localmente com JPA_SHOW_SQL=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_SHOW_SQL:false}

spring.flyway.enabled=true
# As migrations em db/migration sao copias exatas de inventra-data-modeling-2 (postgre/migrations):
# o schema e definido la; nunca editar esses arquivos aqui.
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:1800000}
# Refresh token: 30 dias; o app troca por um novo access token (e um novo refresh) em /api/auth/refresh
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:2592000000}

# Pedido de entrada na cozinha: pendente expira sozinho; busca por código limitada por usuário
app.kitchen-access-request.ttl=${KITCHEN_ACCESS_REQUEST_TTL:7d}
app.kitchen-code-lookup.max-per-hour=${KITCHEN_CODE_LOOKUP_MAX_PER_HOUR:10}

# Descoberta de cozinhas: buscas por minuto, por usuário
app.kitchen-discovery.max-per-minute=${KITCHEN_DISCOVERY_MAX_PER_MINUTE:30}
# Geocodificação pelo Nominatim (OpenStreetMap) quando a cozinha chega sem coordenadas. A política de uso
# exige um User-Agent que identifique o app (de preferência com um contato)
app.geocoding.enabled=${GEOCODING_ENABLED:true}
app.geocoding.user-agent=${GEOCODING_USER_AGENT:Inventra/1.0 (projeto academico Inventra)}

# Alerta EXPIRING: quantos dias antes do vencimento o job diário avisa
app.alerts.expiring-days=${ALERTS_EXPIRING_DAYS:3}

# Login com Google: chave da conta de serviço do Firebase (o JSON puro ou em base64). Nunca commitar.
# Sem ela a API sobe normalmente e só POST /api/auth/google responde 503
firebase.credentials-json=${FIREBASE_CREDENTIALS_JSON:}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.username=${REDIS_USERNAME}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.ssl.enabled=${REDIS_SSL:true}
spring.data.redis.connect-timeout=10s
spring.data.redis.timeout=10s
# /actuator/health é público: detalhes (Postgres, Redis) só para usuário autenticado
management.endpoint.health.show-details=when-authorized

# INV2-25: um consumer ativo por namespace; demais instâncias aguardam a concessão.
app.redis.product-queue.consumer-enabled=${REDIS_PRODUCT_QUEUE_CONSUMER_ENABLED:true}
app.redis.product-queue.key-prefix=${REDIS_PRODUCT_QUEUE_KEY_PREFIX:inventra:product-registration}

# INV2-26: projeção de validade por cozinha, reconstruída ao expirar.
app.redis.ranking.key-prefix=${REDIS_RANKING_KEY_PREFIX:inventra:ranking:expiration}
app.redis.ranking.ttl-seconds=${REDIS_RANKING_TTL_SECONDS:60}
