# Configuração de referência do Redis do Inventra (Redis/Valkey 7, standalone).
# Na Aiven estes parâmetros são ajustados no console do serviço; este arquivo serve para o
# ambiente local (docker run -v ./redis/config/redis.conf:/usr/local/etc/redis/redis.conf
# redis:7 redis-server /usr/local/etc/redis/redis.conf) e documenta o que a produção precisa ter.

# A fila de cadastro guarda pedidos pendentes sem TTL (job:*, pending) e os pedidos de acesso
# decididos ficam como histórico. Despejar essas chaves por falta de memória perde dados, então
# o Redis deve recusar escrita (erro visível na API) em vez de apagar chaves.
maxmemory-policy noeviction

# Sobreviver a reinício do próprio Redis exige persistência (docs/redis-product-queue.md na API).
# AOF com fsync a cada segundo: perde no máximo ~1 s de escrita numa queda.
appendonly yes
appendfsync everysec

# Snapshot RDB como segunda cópia, útil para backup do volume.
save 3600 1 300 100 60 10000

# Expiração ativa padrão; rt:*, kar:* pendentes e resultados da fila dependem de TTL.
hz 10

# Sem senha: só para uso local. Na Aiven a conexão é TLS com usuário e senha (REDIS_SSL=true).
