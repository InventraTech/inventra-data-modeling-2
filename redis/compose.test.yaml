name: inventra-redis-migration-tests
services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventra_ranking_test
      POSTGRES_USER: ranking_test
      POSTGRES_PASSWORD: ranking_test
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ranking_test -d inventra_ranking_test"]
      interval: 2s
      timeout: 3s
      retries: 30
